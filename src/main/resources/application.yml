    models: ${GEMINI_MODEL_1:gemini-2.5-flash},${GEMINI_MODEL_2:gemini-2.5-pro},${GEMINI_MODEL_3:gemini-2.0-flash},${GEMINI_MODEL_4:gemini-1.5-flash},${GEMINI_MODEL_5:gemini-1.5-pro},${GEMINI_MODEL_6:gemini-2.0-flash-lite-preview-02-05},${GEMINI_MODEL_7:gemini-1.5-flash-8b},${GEMINI_MODEL_8:gemini-1.0-pro},${GEMINI_MODEL_9:gemini-2.0-flash-exp},${GEMINI_MODEL_10:gemini-2.0-flash-thinking-exp-01-21}
